name: Upstream sync

# Keeps `master` a clean mirror of KirillOsenkov/MSBuildStructuredLog `main` --
# no fork commits ever land on it -- and opens a PR from `master` into
# `gpui-viewer` when there is something to absorb.
#
# The PR diff is upstream's actual commits rather than one squashed merge, and
# GitHub does the conflict detection. The point is to hit conflicts one upstream
# commit at a time, while the change is still fresh, instead of once a year in a
# heap.
#
# Merge, never rebase: rebasing our commits re-resolves the same conflicts on
# every sync. See docs/fork/MAINTENANCE.md.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  UPSTREAM_URL: https://github.com/KirillOsenkov/MSBuildStructuredLog.git
  TARGET_BRANCH: gpui-viewer
  MIRROR_BRANCH: master
  GH_TOKEN: ${{ github.token }}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpui-viewer
          fetch-depth: 0

      - name: Configure
        run: |
          git config user.name "upstream-sync[bot]"
          git config user.email "upstream-sync@users.noreply.github.com"
          git remote add upstream "$UPSTREAM_URL"
          git fetch --no-tags upstream main
          git fetch --no-tags origin "$MIRROR_BRANCH"

      # A mirror only ever fast-forwards. If it cannot, someone has committed to
      # master, which is exactly the thing this branch is not for -- say so
      # rather than force-pushing over it.
      - name: Update the mirror
        id: mirror
        run: |
          if ! git merge-base --is-ancestor "origin/$MIRROR_BRANCH" upstream/main; then
            echo "::error::origin/$MIRROR_BRANCH is not an ancestor of upstream/main."
            echo "::error::Something was committed to the mirror branch. Sort that out by hand."
            exit 1
          fi
          behind=$(git rev-list --count "origin/$MIRROR_BRANCH..upstream/main")
          echo "Mirror is $behind commit(s) behind upstream/main."
          if [ "$behind" != "0" ]; then
            git push origin "upstream/main:refs/heads/$MIRROR_BRANCH"
          fi

      - name: Anything for us to absorb?
        id: check
        run: |
          pending=$(git rev-list --count "HEAD..upstream/main")
          echo "pending=$pending" >> "$GITHUB_OUTPUT"
          echo "$TARGET_BRANCH is $pending commit(s) behind upstream/main."
          if [ "$pending" != "0" ]; then
            git log --oneline "HEAD..upstream/main" | head -50
          fi

      # GitHub reports mergeability on the PR, but only after a delay and never
      # in the job log. Find out now so the PR body can say.
      - name: Trial merge
        id: merge
        if: steps.check.outputs.pending != '0'
        run: |
          if git merge --no-commit --no-ff upstream/main >/dev/null 2>&1; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
            echo "Merges cleanly."
          else
            echo "clean=false" >> "$GITHUB_OUTPUT"
            {
              echo 'conflicts<<CONFLICTS'
              git diff --name-only --diff-filter=U
              echo 'CONFLICTS'
            } >> "$GITHUB_OUTPUT"
            echo "Conflicts:"
            git diff --name-only --diff-filter=U
          fi
          git merge --abort 2>/dev/null || git reset --hard

      - name: Open or update the sync PR
        if: steps.check.outputs.pending != '0'
        run: |
          if [ "${{ steps.merge.outputs.clean }}" = "true" ]; then
            state="Merges cleanly into \`$TARGET_BRANCH\`."
          else
            state=$(printf '%s\n' \
              "**Conflicts.** Resolve locally -- \`rerere\` is on, so the resolution is" \
              "remembered for the next sync:" \
              "" \
              '```' \
              "git fetch upstream main && git checkout $TARGET_BRANCH && git merge upstream/main" \
              '```' \
              "" \
              "Conflicted paths:" \
              "" \
              '```' \
              "${{ steps.merge.outputs.conflicts }}" \
              '```' \
              "" \
              "If a conflict is in a file on \`docs/fork/upstream-delta.allow\`, that is a fork" \
              "patch colliding with an upstream edit -- a good moment to ask whether that patch" \
              "can go upstream instead.")
          fi
          body=$(printf '%s\n' \
            "${{ steps.check.outputs.pending }} new upstream commit(s) on \`$MIRROR_BRANCH\` (a clean mirror of" \
            "\`KirillOsenkov/MSBuildStructuredLog@main\`)." \
            "" \
            "$state" \
            "" \
            "Opened by \`.github/workflows/upstream-sync.yml\`.")
          if gh pr view "$MIRROR_BRANCH" --json number >/dev/null 2>&1; then
            gh pr edit "$MIRROR_BRANCH" --body "$body"
          else
            gh pr create --base "$TARGET_BRANCH" --head "$MIRROR_BRANCH" \
              --title "Sync with upstream main" --body "$body"
          fi
