name: Upstream sync

# Merges KirillOsenkov/MSBuildStructuredLog main into gpui-viewer every day and
# opens a PR. The point is to hit conflicts one upstream commit at a time,
# while the change is still fresh, instead of once a year in a heap.
#
# Merge, never rebase: rebasing our commits re-resolves the same conflicts on
# every sync. See docs/fork/MAINTENANCE.md.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  UPSTREAM_URL: https://github.com/KirillOsenkov/MSBuildStructuredLog.git
  TARGET_BRANCH: gpui-viewer
  SYNC_BRANCH: upstream-sync
  GH_TOKEN: ${{ github.token }}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpui-viewer
          fetch-depth: 0

      - name: Configure
        run: |
          git config user.name "upstream-sync[bot]"
          git config user.email "upstream-sync@users.noreply.github.com"
          git config rerere.enabled true
          git remote add upstream "$UPSTREAM_URL"
          git fetch --no-tags upstream main

      - name: Anything to do?
        id: check
        run: |
          behind=$(git rev-list --count HEAD..upstream/main)
          echo "behind=$behind" >> "$GITHUB_OUTPUT"
          echo "Behind upstream/main by $behind commit(s)."
          if [ "$behind" = "0" ]; then
            echo "Already up to date."
          else
            git log --oneline HEAD..upstream/main | head -50
          fi

      - name: Merge
        id: merge
        if: steps.check.outputs.behind != '0'
        run: |
          git checkout -B "$SYNC_BRANCH"
          if git merge --no-edit upstream/main; then
            echo "conflicts=" >> "$GITHUB_OUTPUT"
          else
            echo "result=conflict" >> "$GITHUB_OUTPUT"
            {
              echo 'conflicts<<CONFLICTS'
              git diff --name-only --diff-filter=U
              echo 'CONFLICTS'
            } >> "$GITHUB_OUTPUT"
            git merge --abort
          fi

      # A clean merge still has to satisfy the fork's rules and build: upstream
      # can rename a node type or move a file we depend on without conflicting.
      - name: Check upstream delta
        if: steps.check.outputs.behind != '0' && steps.merge.outputs.result != 'conflict'
        id: delta
        continue-on-error: true
        run: ./scripts/check-upstream-delta.sh upstream/main

      - name: Open or update the sync PR
        if: steps.check.outputs.behind != '0' && steps.merge.outputs.result != 'conflict'
        run: |
          git push --force origin "$SYNC_BRANCH"
          body=$(printf '%s\n' \
            "Merges \`upstream/main\` (${{ steps.check.outputs.behind }} new commit(s)) into \`$TARGET_BRANCH\`." \
            "" \
            "Merged cleanly. Delta guard: **${{ steps.delta.outcome }}** — if that says \`failure\`, upstream" \
            "moved something this fork patches; see the job log and reconcile" \
            "\`docs/fork/upstream-delta.allow\`." \
            "" \
            "Opened by \`.github/workflows/upstream-sync.yml\`.")
          if gh pr view "$SYNC_BRANCH" --json number >/dev/null 2>&1; then
            gh pr edit "$SYNC_BRANCH" --body "$body"
          else
            gh pr create --base "$TARGET_BRANCH" --head "$SYNC_BRANCH" \
              --title "Sync with upstream main" --body "$body"
          fi

      - name: File an issue when the merge conflicts
        if: steps.merge.outputs.result == 'conflict'
        run: |
          title="Upstream sync conflicts with $TARGET_BRANCH"
          body=$(printf '%s\n' \
            "\`git merge upstream/main\` into \`$TARGET_BRANCH\` conflicts. Conflicted paths:" \
            "" \
            '```' \
            "${{ steps.merge.outputs.conflicts }}" \
            '```' \
            "" \
            "Resolve locally — \`rerere\` is on, so the resolution is remembered for the next sync:" \
            "" \
            '```' \
            "git fetch upstream main && git checkout $TARGET_BRANCH && git merge upstream/main" \
            '```' \
            "" \
            "If the conflict is in a file on \`docs/fork/upstream-delta.allow\`, that is the fork patch" \
            "colliding with an upstream edit — a good moment to ask whether that patch can go upstream" \
            "instead. Opened by \`.github/workflows/upstream-sync.yml\`.")
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
