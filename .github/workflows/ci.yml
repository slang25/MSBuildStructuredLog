name: CI

on:
  push:
    branches: [gpui-viewer]
  pull_request:
  workflow_dispatch:

# Every job checks out full history: the delta guard needs a merge base with
# upstream, and Nerdbank.GitVersioning computes version height from the commit
# graph and hard-fails on a shallow clone.
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  # Keeps the fork's delta against upstream small and accounted for.
  # See docs/fork/MAINTENANCE.md.
  fork-delta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/KirillOsenkov/MSBuildStructuredLog.git
          git fetch --no-tags upstream main
      - name: Check upstream delta
        run: ./scripts/check-upstream-delta.sh upstream/main

  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - name: Build
        run: |
          dotnet build src/StructuredLogger/StructuredLogger.csproj -c Release
          dotnet build src/StructuredLogger.Utils/StructuredLogger.Utils.csproj -c Release
          dotnet build src/StructuredLogViewer.Semantics/StructuredLogViewer.Semantics.csproj -c Release
          dotnet build src/BinlogMcp/BinlogMcp.csproj -c Release

  # Upstream's test project is net472 and references System.Windows.Forms, so
  # it only runs on Windows. Worth a job of its own for one test:
  # EveryConcreteObjectModelTypeCanBeCreated is what stops the hand-written
  # Serialization.CreateNode switch from drifting when upstream adds a node type.
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      # BinaryLoggerTests is excluded: those three tests run a real build through
      # Microsoft.Build.Locator, and on a clean windows-latest image the MSBuild it
      # finds needs a FrozenSet.Create overload .NET Framework's BCL does not have
      # (MissingMethodException in XMakeElements' static ctor). Nothing to do with
      # this fork -- it needs an MSBuild install matching the net472 host. The rest
      # of the suite, including the object-model test above, passes.
      - run: dotnet test src/StructuredLogger.Tests/StructuredLogger.Tests.csproj -c Release --filter "FullyQualifiedName!~BinaryLoggerTests"

  # The NativeAOT bridge and the gpui viewer that loads it. macOS-only: gpui's
  # platform layer and libmslog.dylib both are.
  viewer:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/StructuredLogViewer.Gpui
      # No toolchain action: rust-toolchain.toml pins the channel gpui's rev
      # needs, and the runner's rustup installs it on first cargo invocation.
      - name: Build libmslog.dylib
        run: ./src/StructuredLogViewer.NativeBridge/build-dylib.sh
      - name: cargo test
        working-directory: src/StructuredLogViewer.Gpui
        # The UI tests find the dylib at ../StructuredLogViewer.NativeBridge/out,
        # which is where build-dylib.sh just put it.
        #
        # --test-threads=1: the bridge SIGSEGVs when touched from two test threads
        # at once (see TESTING.md). The serial() lock covers the UI tests, but not
        # the unit tests running alongside them -- which is survivable locally and
        # was not on the runner.
        run: cargo test -- --test-threads=1

  # Not built here: src/StructuredLogViewer.Web/engine. Its toolchain is pinned
  # to a specific SDK + workload-manifest layout on a dev machine (see that
  # directory's README and build.sh); reproducing it on a hosted runner is a
  # separate piece of work.
