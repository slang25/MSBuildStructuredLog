<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=0" />
    <title>MSBuild Structured Log Viewer</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link data-trunk rel="copy-file" href="favicon.png" />
    <link data-trunk rel="copy-file" href="apple-touch-icon.png" />
    <link data-trunk rel="rust" href="../Cargo.toml" data-bin="structured-log-viewer-gpui" data-bindgen-target="web" data-wasm-opt="0" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #1e1e1e; overflow: hidden; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; -webkit-user-select: none; user-select: none; }
      #binlog-file { position: fixed; left: -9999px; top: -9999px; width: 1px; height: 1px; opacity: 0; }
    </style>
  </head>
  <body>
    <!-- The web stand-in for the native open panel; wired from Rust (src/web.rs). -->
    <input id="binlog-file" type="file" accept=".binlog" />
  </body>
</html>
