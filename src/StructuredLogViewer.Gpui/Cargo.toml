[package]
name = "structured-log-viewer-gpui"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "structured-log-viewer-gpui"
path = "src/main.rs"

[dependencies]
# Same rev gpui-dotnet resolved, so the cargo git cache is reused.
gpui = { git = "https://github.com/zed-industries/zed", rev = "f66ed399" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
futures = "0.3"

# Native: the platform crate plus the dylib loader for libmslog.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "f66ed399", features = ["runtime_shaders", "font-kit"] }
libloading = "0.8"

# Web: gpui_web directly (not via gpui_platform) so its default
# `multithreaded` feature stays off — that feature needs wasm atomics and a
# nightly toolchain. The engine runs in a Web Worker instead.
[target.'cfg(target_family = "wasm")'.dependencies]
gpui_web = { git = "https://github.com/zed-industries/zed", rev = "f66ed399", default-features = false }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
    "Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "FileList", "File",
    "Location", "UrlSearchParams", "Worker", "WorkerOptions", "WorkerType", "MessageEvent",
    "Event", "EventTarget", "console",
] }

# Only the `generate-icons` example needs these, and they are already in the
# lock file: gpui's `svg()` element pulls in resvg and tiny-skia.
[dev-dependencies]
resvg = "0.46"
usvg = "0.46"
tiny-skia = "0.11"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
